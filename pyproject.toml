[project]
name = "ai-music"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cupy-cuda12x[ctk]>=14.2.0",
    "datasets>=5.1.0",
    "esig>=1.0.0",
    "huggingface-hub>=2.2.0",
    "imageio-ffmpeg>=0.6.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "remotezip>=0.12.6",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[project.scripts]
ai-music = "ai_music:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.extra-build-dependencies]
iisignature = ["numpy"]
